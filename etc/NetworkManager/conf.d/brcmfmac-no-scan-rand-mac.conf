# Keep the Pi's real MAC address while scanning, on the onboard Wi-Fi
# (brcmfmac). NetworkManager otherwise scans with a random MAC and swaps
# back to the real one right before associating; Kali's own
# no-mac-addr-change.conf does this only for the eagle_sdio and wl drivers.
# Added 2026-10-18 after boots where the router ignored the Pi's
# association requests for up to ~37s — see CLAUDE.md "Slow Wi-Fi at boot".
# Linked from /etc/NetworkManager/conf.d/ (see "Installed system files").
[device-brcmfmac-no-scan-rand-mac]
match-device=driver:brcmfmac
wifi.scan-rand-mac-address=no
