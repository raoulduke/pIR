# Journal size/age caps — installed to /etc/systemd/journald.conf.d/
# (see CLAUDE.md "Setup (on the Pi)" and "Log retention").
#
# journald enforces these itself on every write, so no scheduled cleanup
# job is needed (a timer would only add a CPU wakeup for nothing). ~2MB/day
# at measured rates, so 200M is roughly 3 months of history.
[Journal]
SystemMaxUse=200M
SystemKeepFree=2G
MaxRetentionSec=3month
# rsyslog is disabled (scripts/disable-unused-services.sh) — don't keep
# forwarding every message to a syslog socket nothing reads.
ForwardToSyslog=no
